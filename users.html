<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Gestion des utilisateurs - Suivi Matériel</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="users-management">
    <div class="app-shell app-shell--wide">
      <header class="app-header app-header--detail">
        <div class="app-header__side app-header__side--left">
          <button id="usersBackButton" class="back-button" type="button" aria-label="Retour"><img src="Icon/btn-retour.png" alt="retour" class="btn-retour" /></button>
        </div>
        <div class="app-header__center">
          <div class="header-title"><h1>Gestion Admin</h1></div>
        </div>
        <div class="app-header__side app-header__side--right" aria-hidden="true"></div>
      </header>
      <main class="page-content page-content--wide main-content">
        <section class="surface-card details-card">
          <div class="maintenance-card-header">
            <h2 class="section-title">Maintenance de la page</h2>
            <div class="maintenance-toggle-row">
              <label class="switch" for="maintenanceToggle">
                <input id="maintenanceToggle" type="checkbox" role="switch" aria-label="Activer ou désactiver la maintenance" />
                <span class="slider"></span>
              </label>
              <span id="maintenanceStatusText" class="maintenance-toggle-row__status">Désactivé</span>
            </div>
          </div>
        </section>
        <section class="surface-card admin-message-card" aria-labelledby="adminMessageTitle">
          <h2 id="adminMessageTitle" class="section-title">📢 Message aux utilisateurs</h2>
          <form id="adminMessageForm" class="admin-message-form">
            <label class="admin-message-field" for="adminMessageInputTitle">
              <span>Titre du message</span>
              <input id="adminMessageInputTitle" type="text" maxlength="120" autocomplete="off" required />
            </label>
            <label class="admin-message-field" for="adminMessageInputBody">
              <span>Corps du message</span>
              <textarea id="adminMessageInputBody" rows="5" maxlength="1200" required></textarea>
            </label>
            <div class="admin-message-actions">
              <button id="adminMessageSendButton" type="submit" class="btn-primary">Envoyer</button>
              <button id="adminMessageCancelButton" type="button" class="btn-secondary">Annuler</button>
            </div>
          </form>
        </section>
        <section class="surface-card table-card">
          <h2 class="section-title">Tous les utilisateurs</h2>
          <div class="table-wrapper table-wrapper--users">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Point</th>
                  <th>Photo</th>
                  <th>Nom</th>
                  <th>Dernière activité</th>
                  <th>Email</th>
                  <th>Rôle</th>
                  <th>Autorisé (maintenance)</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="usersTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
      <div id="toast" class="toast" aria-live="polite"></div>
    </div>
    <script type="module" src="js/maintenance-banner.js"></script>
    <script type="module" src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script type="module" src="js/app.js"></script>
    <script type="module">
      import { addDoc, collection, onSnapshot, doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
      import { firebaseDb } from './js/firebase-core.js';

      function cleanString(value) {
        return String(value || '').trim();
      }

      function toLower(value) {
        return cleanString(value).toLowerCase();
      }

      function resolveDisplayName(user) {
        const displayName = cleanString(user.displayName || user.username || user.name);
        if (displayName) {
          return displayName;
        }
        const emailPrefix = cleanString(user.email).split('@')[0];
        return emailPrefix || 'Utilisateur';
      }

      function getInitials(name) {
        const normalized = cleanString(name).replace(/\s+/g, ' ').replace(/[^\p{L}\p{N} ]/gu, '');
        return (normalized.slice(0, 2) || 'US').toUpperCase();
      }

      function resolveRole(user) {
        const role = cleanString(user.role);
        const normalized = toLower(role);
        if (normalized === 'admin') {
          return 'admin';
        }
        if (normalized === 'standard' || normalized === 'adjoint') {
          return 'Standard';
        }
        return 'Limité';
      }

      function resolveMaintenanceAuthorized(user) {
        if (typeof user.maintenanceAuthorized === 'boolean') {
          return user.maintenanceAuthorized;
        }
        if (typeof user.maintenanceAccess === 'boolean') {
          return user.maintenanceAccess;
        }
        return false;
      }

      function syncDefaults(user) {
        const email = cleanString(user.email);
        if (!user.id || !email) {
          return;
        }

        const updates = {};
        if (!cleanString(user.role)) {
          updates.role = 'Limité';
        }

        const maintenanceAuthorized = resolveMaintenanceAuthorized(user);
        if (!Object.prototype.hasOwnProperty.call(user, 'maintenanceAuthorized')) {
          updates.maintenanceAuthorized = maintenanceAuthorized;
        }
        if (!Object.prototype.hasOwnProperty.call(user, 'maintenanceAccess')) {
          updates.maintenanceAccess = maintenanceAuthorized;
        }

        if (Object.keys(updates).length) {
          updates.updatedAt = serverTimestamp();
          setDoc(doc(firebaseDb, 'users', user.id), updates, { merge: true }).catch(() => {});
        }
      }

      function parseActivityDate(value) {
        if (!value) {
          return null;
        }
        let normalizedValue = value;
        if (typeof value?.toDate === 'function') {
          normalizedValue = value.toDate();
        } else if (typeof value?.seconds === 'number') {
          normalizedValue = new Date(value.seconds * 1000);
        }
        const parsed = new Date(normalizedValue);
        return Number.isNaN(parsed.getTime()) ? null : parsed;
      }

      function formatLastActivity(value, referenceDate = new Date()) {
        const activityDate = parseActivityDate(value);
        if (!activityDate) {
          return '-';
        }

        const elapsedMs = Math.max(0, referenceDate.getTime() - activityDate.getTime());
        const elapsedMinutes = Math.floor(elapsedMs / 60000);
        if (elapsedMinutes < 5) {
          return '🟢 En ligne';
        }
        if (elapsedMinutes < 60) {
          return `Il y a ${elapsedMinutes} min`;
        }

        const elapsedHours = Math.floor(elapsedMinutes / 60);
        if (elapsedHours < 24) {
          return `Il y a ${elapsedHours} h`;
        }

        const elapsedDays = Math.floor(elapsedHours / 24);
        if (elapsedDays < 7) {
          return `Il y a ${elapsedDays} jour${elapsedDays > 1 ? 's' : ''}`;
        }

        const elapsedWeeks = Math.floor(elapsedDays / 7);
        if (elapsedDays < 30) {
          return `Il y a ${elapsedWeeks} semaine${elapsedWeeks > 1 ? 's' : ''}`;
        }

        const elapsedMonths = Math.max(1, Math.floor(elapsedDays / 30));
        return `Il y a ${elapsedMonths} mois`;
      }

      function sortUsersByPointsAndName(users, pointsByUser) {
        return [...users].sort((a, b) => {
          const pointsA = Number(pointsByUser?.[a.id] || 0);
          const pointsB = Number(pointsByUser?.[b.id] || 0);
          if (pointsA !== pointsB) {
            return pointsB - pointsA;
          }
          return resolveDisplayName(a).localeCompare(resolveDisplayName(b), 'fr', { sensitivity: 'base' });
        });
      }

      function renderUsers(users, pointsByUser = {}) {
        const tableBody = document.getElementById('usersTableBody');
        if (!tableBody) {
          return;
        }

        const rows = sortUsersByPointsAndName(users, pointsByUser)
          .map((user) => {
            const displayName = resolveDisplayName(user);
            const email = cleanString(user.email);
            const role = resolveRole(user);
            const maintenanceAuthorized = resolveMaintenanceAuthorized(user);
            const photoURL = cleanString(user.photoURL || user.avatarUrl || user.avatar);
            const isPrimaryAdmin = toLower(email) === 'andrainaaina@gmail.com';

            const avatarMarkup = photoURL
              ? `<span class="users-avatar"><img src="${photoURL.replace(/"/g, '&quot;')}" alt="Avatar de ${displayName.replace(/"/g, '&quot;')}" /></span>`
              : `<span class="users-avatar" aria-hidden="true">${getInitials(displayName)}</span>`;

            return `
              <tr data-user-id="${user.id}">
                <td class="users-point-cell">${Number(pointsByUser?.[user.id] || 0)}</td>
                <td>${avatarMarkup}</td>
                <td>${displayName}</td>
                <td class="users-last-activity-cell">${formatLastActivity(user.lastActivity)}</td>
                <td class="users-email-cell">${email || '-'}</td>
                <td>
                  ${isPrimaryAdmin ? 'admin' : `
                  <select class="users-role-select" data-user-role="${user.id}">
                    <option value="Standard" ${role === 'Standard' ? 'selected' : ''}>Standard</option>
                    <option value="Limité" ${role === 'Limité' ? 'selected' : ''}>Limité</option>
                  </select>`}
                </td>
                <td class="maintenance-access-cell">
                  <input
                    type="checkbox"
                    class="maintenance-access-checkbox"
                    data-user-maintenance-access="${user.id}"
                    ${maintenanceAuthorized ? 'checked' : ''}
                    aria-label="Autoriser ${displayName.replace(/"/g, '&quot;')} pendant la maintenance"
                  />
                </td>
                <td>
                  <button type="button" class="btn-delete" data-delete-user="${user.id}" ${isPrimaryAdmin ? 'disabled' : ''}>Supprimer</button>
                </td>
              </tr>
            `;
          })
          .join('');

        tableBody.innerHTML = rows;

        tableBody.querySelectorAll('[data-user-role]').forEach((select) => {
          select.addEventListener('change', async () => {
            const userId = select.getAttribute('data-user-role');
            const selected = toLower(select.value) === 'standard' ? 'Standard' : 'Limité';
            try {
              await setDoc(
                doc(firebaseDb, 'users', userId),
                {
                  role: selected,
                  updatedAt: serverTimestamp(),
                },
                { merge: true },
              );
              await window.StorageService?.recordCurrentUserActivity?.();
              window.UiService?.showToast('Rôle mis à jour.');
            } catch (_error) {
              window.UiService?.showToast('Impossible de mettre à jour le rôle.');
            }
          });
        });

        tableBody.querySelectorAll('[data-user-maintenance-access]').forEach((checkbox) => {
          checkbox.addEventListener('change', async () => {
            const userId = checkbox.getAttribute('data-user-maintenance-access');
            const checked = checkbox.checked;
            try {
              await setDoc(
                doc(firebaseDb, 'users', userId),
                {
                  maintenanceAuthorized: checked,
                  maintenanceAccess: checked,
                  updatedAt: serverTimestamp(),
                },
                { merge: true },
              );
              await window.StorageService?.recordCurrentUserActivity?.();
              window.UiService?.showToast('Accès maintenance mis à jour.');
            } catch (_error) {
              checkbox.checked = !checked;
              window.UiService?.showToast('Impossible de mettre à jour l’accès maintenance.');
            }
          });
        });

        tableBody.querySelectorAll('[data-delete-user]').forEach((button) => {
          button.addEventListener('click', async () => {
            const userId = button.getAttribute('data-delete-user');
            if (!userId || !window.StorageService?.deleteUser) {
              return;
            }
            button.disabled = true;
            try {
              await window.StorageService.deleteUser(userId);
              window.UiService?.showToast('Utilisateur supprimé.');
            } catch (_error) {
              window.UiService?.showToast('Impossible de supprimer cet utilisateur.');
            } finally {
              button.disabled = false;
            }
          });
        });
      }

      let currentUsers = [];
      let currentPointsByUser = {};
      let lastActivityRefreshId = null;

      function renderCurrentUsers() {
        renderUsers(currentUsers, currentPointsByUser);
      }

      lastActivityRefreshId = window.setInterval(renderCurrentUsers, 60000);
      window.addEventListener('pagehide', () => {
        if (lastActivityRefreshId) {
          window.clearInterval(lastActivityRefreshId);
        }
      });

      const adminMessageForm = document.getElementById('adminMessageForm');
      const adminMessageTitleInput = document.getElementById('adminMessageInputTitle');
      const adminMessageBodyInput = document.getElementById('adminMessageInputBody');
      const adminMessageSendButton = document.getElementById('adminMessageSendButton');
      const adminMessageCancelButton = document.getElementById('adminMessageCancelButton');

      adminMessageCancelButton?.addEventListener('click', () => {
        adminMessageForm?.reset();
        adminMessageTitleInput?.focus();
      });

      adminMessageForm?.addEventListener('submit', async (event) => {
        event.preventDefault();
        const title = cleanString(adminMessageTitleInput?.value);
        const body = cleanString(adminMessageBodyInput?.value);
        if (!title || !body) {
          window.UiService?.showToast('Veuillez remplir le titre et le corps du message.');
          return;
        }

        if (adminMessageSendButton) {
          adminMessageSendButton.disabled = true;
        }

        try {
          await addDoc(collection(firebaseDb, 'adminMessages'), {
            title,
            body,
            createdAt: serverTimestamp(),
          });
          adminMessageForm.reset();
          await window.StorageService?.recordCurrentUserActivity?.();
          window.UiService?.showToast('Message envoyé aux utilisateurs.');
        } catch (_error) {
          window.UiService?.showToast('Impossible d’envoyer le message.');
        } finally {
          if (adminMessageSendButton) {
            adminMessageSendButton.disabled = false;
          }
        }
      });

      const usersRef = collection(firebaseDb, 'users');
      const outsRef = collection(firebaseDb, 'pages', 'page2', 'items');
      onSnapshot(
        usersRef,
        (snapshot) => {
          const users = snapshot.docs.map((entry) => ({ id: entry.id, ...(entry.data() || {}) }));
          users.forEach(syncDefaults);
          currentUsers = users;
          renderCurrentUsers();
        },
        () => {
          window.UiService?.showToast('Impossible de charger la liste des utilisateurs.');
        },
      );

      onSnapshot(
        outsRef,
        (snapshot) => {
          currentPointsByUser = snapshot.docs.reduce((pointsByUser, entry) => {
            const data = entry.data() || {};
            const creatorId = cleanString(data.createdBy || data.ownerId);
            if (creatorId) {
              pointsByUser[creatorId] = (pointsByUser[creatorId] || 0) + 1;
            }
            return pointsByUser;
          }, {});
          renderCurrentUsers();
        },
        () => {
          window.UiService?.showToast('Impossible de charger les points utilisateurs.');
        },
      );
    </script>

  </body>
</html>
